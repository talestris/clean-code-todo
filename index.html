<!doctype html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>

  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg" /><a
        class="header-image"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="main">
      <p id="section-add">
        <label for="new-task">Add Item</label>
      </p>
      <div class="task-add">
        <input id="new-task" class="add-task-input" type="text" /><button
          class="button add-button"
        >
          Add
        </button>
      </div>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox" /><label>Pay Bills</label
          ><input type="text" class="task-edit-input" /><button
            class="button edit-button"
          >
            Edit</button
          ><button class="button delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox" /><label>Go Shopping</label
          ><input
            type="text"
            value="Go Shopping"
            class="task-edit-input"
          /><button class="button edit-button">Save</button
          ><button class="button delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label>See the Doctor</label
          ><input type="text" class="task-edit-input" /><button
            class="button edit-button"
          >
            Edit</button
          ><button class="button delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
